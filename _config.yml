title: "GAEMI"
description: "배우고, 만들고, 기록합니다."
lang: ko
timezone: Asia/Seoul
url: "https://gaemi23.github.io"
baseurl: ""
permalink: /posts/:title/
future: false
markdown: kramdown
highlighter: rouge
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
defaults:
  - scope:
      path: ""
    values:
      layout: default
  - scope:
      path: ""
      type: posts
    values:
      layout: post
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor

# 실제 사진 파일을 assets/images에 넣고 이 경로를 바꾸세요.
profile_image: /assets/images/gaemi.png

# 글이 없어도 목차에 표시하는 기본 카테고리 (글의 대소문자는 자동으로 통합)
blog_categories: [Pwn, Rev, Crypto, Web, Forensics, Misc]
